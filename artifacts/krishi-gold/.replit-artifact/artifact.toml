kind = "web"
previewPath = "/"
title = "Krishi Gold"
description = "A premium mustard oil brand website recreated from the supplied mobile reference, with responsive product, process, story, contact, and footer sections."
version = "1.0.0"
id = "artifacts/krishi-gold"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20798

[services.development]
run = "pnpm --filter @workspace/krishi-gold run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/krishi-gold", "run", "build" ]
serve = "static"
publicDir = "artifacts/krishi-gold/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20798"
BASE_PATH = "/"
